<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8fafc">
<title>Discrete Tabs Demo</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--text:#172033;--muted:#8490a3;--border:#e8edf4;--blue:#3b82f6;--yellow:#eab308;--red:#ef4444}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:var(--text);background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.demo{width:100%;max-width:560px;text-align:center}.demo h1{margin:0 0 8px;font-size:clamp(24px,5vw,32px);letter-spacing:-.8px}.demo-description{margin:0 0 36px;color:var(--muted);line-height:1.6}
.tabs{display:flex;align-items:stretch;gap:8px;width:100%;padding:8px;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:0 12px 36px #1720330f}
.tab{--active-color:var(--blue);position:relative;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-width:0;min-height:94px;padding:13px 8px;border:1px solid transparent;border-radius:12px;color:var(--muted);background:transparent;cursor:pointer;transition:color 180ms ease,background 180ms ease,border-color 180ms ease,transform 180ms ease}
.tab:hover{background:#f8fafc}.tab:active{transform:scale(.97)}.tab[aria-selected=true]{color:var(--active-color);background:color-mix(in srgb,var(--active-color) 9%,white);border-color:color-mix(in srgb,var(--active-color) 20%,white)}
.tab[data-tab=mail]{--active-color:var(--blue)}.tab[data-tab=planner]{--active-color:var(--yellow)}.tab[data-tab=mail2]{--active-color:var(--red)}
.tab-icon{display:grid;place-items:center;width:30px;height:30px}.tab-icon svg{display:block;width:24px;height:24px;fill:currentColor}.tab-label{font-size:13px;font-weight:650;line-height:1.4}
.tab-panel{margin-top:24px;padding:28px 20px;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-align:left;animation:reveal 220ms ease}.tab-panel h2{margin:0 0 8px;font-size:19px}.tab-panel p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.panel-indicator{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--panel-color,var(--blue));font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:1px}.panel-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
button:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}@keyframes reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:420px){body{padding:16px}.tabs{gap:4px;padding:5px}.tab{min-height:82px;padding:10px 4px;gap:7px}.tab-label{font-size:12px}.tab-panel{padding:22px 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="demo">
  <h1>Discrete Tabs</h1>
  <p class="demo-description">Switch between your inbox, planner, and alerts.</p>
  <div class="tabs" role="tablist" aria-label="Main sections">
    <button class="tab" id="tab-mail" data-tab="mail" role="tab" aria-selected="true" aria-controls="panel" tabindex="0" type="button">
      <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4.2-8 5-8-5V6l8 5 8-5v2.2ZM4 18V10.6l8 5 8-5V18H4Z"/></svg></span>
      <span class="tab-label">Inbox</span>
    </button>
    <button class="tab" id="tab-planner" data-tab="planner" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" type="button">
      <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1ZM4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9H4Zm1-4a1 1 0 0 0-1 1v1h16V7a1 1 0 0 0-1-1H5Zm3 7h3v3H8v-3Zm5 0h3v3h-3v-3Z"/></svg></span>
      <span class="tab-label">Planner</span>
    </button>
    <button class="tab" id="tab-mail2" data-tab="mail2" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" type="button">
      <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3a1.5 1.5 0 0 0-3 0v1.16A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg></span>
      <span class="tab-label">Alerts</span>
    </button>
  </div>
  <section class="tab-panel" id="panel" role="tabpanel" aria-labelledby="tab-mail" tabindex="0">
    <div class="panel-indicator" id="panelIndicator"><span class="panel-dot"></span><span id="panelCategory">Inbox</span></div>
    <h2 id="panelTitle">Your inbox</h2>
    <p id="panelDescription">Your messages and conversations will appear here.</p>
  </section>
</main>
<script>
"use strict";
const tabContent={
 mail:{title:"Your inbox",description:"Your messages and conversations will appear here.",category:"Inbox",color:"#3b82f6"},
 planner:{title:"Your planner",description:"Organize your schedule, plan tasks, and keep track of important dates.",category:"Planner",color:"#eab308"},
 mail2:{title:"Your alerts",description:"Notifications, reminders, and important updates will appear here.",category:"Alerts",color:"#ef4444"}
};
const tabs=[...document.querySelectorAll('[role="tab"]')];
const panel=document.getElementById("panel");
const panelTitle=document.getElementById("panelTitle");
const panelDescription=document.getElementById("panelDescription");
const panelCategory=document.getElementById("panelCategory");
const panelIndicator=document.getElementById("panelIndicator");
function activateTab(tab,moveFocus=false){
 const content=tabContent[tab.dataset.tab];if(!content)return;
 tabs.forEach(item=>{const active=item===tab;item.setAttribute("aria-selected",String(active));item.tabIndex=active?0:-1});
 panel.setAttribute("aria-labelledby",tab.id);panelTitle.textContent=content.title;panelDescription.textContent=content.description;panelCategory.textContent=content.category;panelIndicator.style.setProperty("--panel-color",content.color);
 panel.style.animation="none";void panel.offsetWidth;panel.style.animation="";
 if(moveFocus)tab.focus();
}
tabs.forEach((tab,index)=>{
 tab.addEventListener("click",()=>activateTab(tab));
 tab.addEventListener("keydown",event=>{
  let nextIndex=index;
  switch(event.key){case"ArrowRight":nextIndex=(index+1)%tabs.length;break;case"ArrowLeft":nextIndex=(index-1+tabs.length)%tabs.length;break;case"Home":nextIndex=0;break;case"End":nextIndex=tabs.length-1;break;default:return}
  event.preventDefault();activateTab(tabs[nextIndex],true);
 });
});
</script>
</body>
</html>
